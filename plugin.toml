id = "davidhsv.bazel"
name = "Bazel"
version = "0.1.0"
description = "Bazel for OpenIDEA: syncs Java projects from their BUILD files with the Bazel IntelliJ plugin's aspect, so the Java language server resolves code from Bazel instead of Maven. Starlark and .bazelproject editing."
authors = ["David Vieira <davidhsv@gmail.com>"]
license = "Apache-2.0"
change-notes = "0.1.0 — first release: Sync Project with BUILD Files (aspect sync of Java targets into an Eclipse project for jdtls), Starlark and project view languages."
categories = ["frameworks", "languages", "tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-startup-finished", "on-event:files-changed", "on-event:editor-focused"]

[capabilities]
# project.write: the aspect (.openidea/bazel), the Eclipse project (.project, .classpath, .settings)
# and the jdtls settings (.openidea/settings.toml).
required = ["project.read", "project.write"]
# Bazel's launcher, and its output base (macOS: /private/var/tmp/_bazel_$USER, Linux: ~/.cache/bazel),
# where the aspect's outputs and the jars live.
optional = ["process:bazelisk", "process:bazel", "fs.read:/private/var/tmp", "fs.read:~/.cache/bazel", "events"]

[[contributes.commands]]
id = "sync"
title = "Bazel: Sync Project with BUILD Files"
category = "Bazel"
when = "workspaceContains:MODULE.bazel || workspaceContains:WORKSPACE || workspaceContains:WORKSPACE.bazel || workspaceContains:.bazelproject"

[[contributes.commands]]
id = "open-sync-log"
title = "Bazel: Show Last Sync Log"
category = "Bazel"
when = "workspaceContains:MODULE.bazel || workspaceContains:WORKSPACE || workspaceContains:WORKSPACE.bazel || workspaceContains:.bazelproject"

[[contributes.commands]]
id = "open-project-view"
title = "Bazel: Open Project View File"
category = "Bazel"
when = "workspaceContains:MODULE.bazel || workspaceContains:WORKSPACE || workspaceContains:WORKSPACE.bazel || workspaceContains:.bazelproject"

[[contributes.commands]]
id = "test-file"
title = "Bazel: Test File"
category = "Bazel"
when = "workspaceContains:.openidea/bazel/targets.tsv"

[[contributes.commands]]
id = "debug-test-file"
title = "Bazel: Debug Test File"
category = "Bazel"
when = "workspaceContains:.openidea/bazel/targets.tsv"

[[contributes.menus]]
menu = "editor.context"
command = "test-file"
submenu = "Bazel"

[[contributes.menus]]
menu = "editor.context"
command = "debug-test-file"
submenu = "Bazel"

[contributes.settings]
schema = "settings.schema.json"

[[contributes.languages]]
path = "languages/starlark.toml"

[[contributes.languages]]
path = "languages/bazelproject.toml"

[[contributes.languages]]
path = "languages/bazelrc.toml"

[[contributes.menus]]
menu = "tools"
command = "sync"

[[contributes.menus]]
menu = "projectView.context"
command = "sync"
when = "workspaceContains:MODULE.bazel || workspaceContains:WORKSPACE || workspaceContains:WORKSPACE.bazel"

[[contributes.runDetectors]]
id = "bazel-build-all"
name = "bazel build //..."
files = ["MODULE.bazel", "WORKSPACE", "WORKSPACE.bazel"]
command = "bazelisk"
args = ["build", "//..."]

[[contributes.runDetectors]]
id = "bazel-test-all"
name = "bazel test //..."
files = ["MODULE.bazel", "WORKSPACE", "WORKSPACE.bazel"]
command = "bazelisk"
args = ["test", "//..."]
test = true
